<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dolist. — Your personal task manager</title>
    <meta name="description" content="dolist. is a minimal, focused task manager designed to help you stay organized and make progress every day." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- Mobile top bar -->
    <header class="mobile-header" id="mobile-header">
      <span class="logo-name">dolist.</span>
      <button class="btn-menu" id="btn-menu" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6"  x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </header>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <div id="app">

      <!-- SIDEBAR -->
      <aside id="sidebar" aria-label="Navigation and progress">
        <div class="sidebar-inner">

          <!-- Brand -->
          <div class="sidebar-brand">
            <div class="logo-name">dolist.</div>
            <p class="logo-date" id="today-date"></p>
          </div>

          <!-- Progress -->
          <div class="sidebar-section">
            <div class="progress-label-row">
              <span class="section-label">Progress</span>
              <span class="progress-pct" id="progress-pct">0%</span>
            </div>
            <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-track">
              <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
            <p class="progress-sub" id="progress-sub">0 of 0 done</p>
          </div>

          <div class="divider"></div>

          <!-- Categories -->
          <nav aria-label="Categories">
            <p class="nav-section-label">Categories</p>
            <div id="cat-nav" role="list"></div>
          </nav>

          <div class="divider"></div>

          <!-- Priority legend -->
          <div class="sidebar-section">
            <p class="section-label" style="margin-bottom: 0.625rem;">Priority</p>
            <div class="priority-legend" role="list">
              <div class="priority-legend-item" role="listitem">
                <span class="dot dot-high" aria-hidden="true"></span>
                <span>High</span>
              </div>
              <div class="priority-legend-item" role="listitem">
                <span class="dot dot-medium" aria-hidden="true"></span>
                <span>Medium</span>
              </div>
              <div class="priority-legend-item" role="listitem">
                <span class="dot dot-low" aria-hidden="true"></span>
                <span>Low</span>
              </div>
            </div>
          </div>

          <!-- Sidebar close (mobile) -->
          <button class="btn-sidebar-close" id="btn-sidebar-close" aria-label="Close menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6"  y1="6" x2="18" y2="18" />
            </svg>
            Close
          </button>

        </div>
      </aside>

      <!-- MAIN -->
      <main id="main">

        <!-- Header -->
        <div class="main-header">
          <div class="main-heading">
            <h1 class="main-title" id="main-title">All Tasks</h1>
            <p class="main-subtitle" id="main-subtitle">0 tasks remaining</p>
          </div>
          <button class="btn-new-task" id="btn-new-task" aria-expanded="false" aria-controls="add-form">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            New Task
          </button>
        </div>

        <!-- Add Task Form -->
        <div id="add-form" class="add-form" aria-hidden="true">
          <input
            class="form-input"
            type="text"
            id="new-task-text"
            placeholder="What needs to be done?"
            autocomplete="off"
            aria-label="New task"
          />
          <div class="form-controls">
            <!-- Priority -->
            <div class="form-field">
              <label for="new-priority" class="form-field-label">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                  <line x1="4" y1="22" x2="4" y2="15"/>
                </svg>
                Priority
              </label>
              <select class="form-select" id="new-priority">
                <option value="high">High</option>
                <option value="medium" selected>Medium</option>
                <option value="low">Low</option>
              </select>
            </div>
            <!-- Category -->
            <div class="form-field">
              <label for="new-category" class="form-field-label">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="3" width="7" height="7"/>
                  <rect x="14" y="3" width="7" height="7"/>
                  <rect x="14" y="14" width="7" height="7"/>
                  <rect x="3" y="14" width="7" height="7"/>
                </svg>
                Category
              </label>
              <select class="form-select" id="new-category">
                <option value="work">Work</option>
                <option value="personal" selected>Personal</option>
                <option value="health">Health</option>
                <option value="learning">Learning</option>
              </select>
            </div>
            <!-- Due Date -->
            <div class="form-field">
              <label for="new-due" class="form-field-label">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8"  y1="2" x2="8"  y2="6"/>
                  <line x1="3"  y1="10" x2="21" y2="10"/>
                </svg>
                Due
              </label>
              <input class="form-date" type="date" id="new-due" aria-label="Due date" />
            </div>
            <div class="form-actions">
              <button class="btn-cancel" id="btn-cancel">Cancel</button>
              <button class="btn-add" id="btn-add-task" disabled>Add Task</button>
            </div>
          </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs" id="filter-tabs" role="tablist">
          <button class="filter-tab active" data-filter="all"       role="tab" aria-selected="true">All</button>
          <button class="filter-tab"        data-filter="active"    role="tab" aria-selected="false">Active</button>
          <button class="filter-tab"        data-filter="completed" role="tab" aria-selected="false">Completed</button>
          <button class="btn-clear" id="btn-clear" style="display: none;">Clear completed</button>
        </div>

        <!-- Task List -->
        <ul id="task-list" aria-label="Tasks" aria-live="polite"></ul>

        <!-- Footer count -->
        <p class="task-footer" id="task-footer" style="display: none;"></p>

      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
